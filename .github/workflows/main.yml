- name: Establish Automatic Tailscale Connection
        shell: pwsh
        run: |
          $AuthKey = "${{ secrets.TAILSCALE_AUTH_KEY }}".Trim()
          
          if (-not $AuthKey) {
              Write-Error "❌ TAILSCALE_AUTH_KEY is missing or empty in GitHub Secrets!"
              exit 1
          }

          Write-Host "Connecting to Tailscale with key..."
          
          # Force connection using Tailscale CLI
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey="$AuthKey" --hostname="gh-runner-$env:GITHUB_RUN_ID" --ephemeral --accept-routes --force-relogin

          # Wait and check for IP
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 15) {
              Start-Sleep -Seconds 4
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "❌ Tailscale IP assignment failed. Check key permissions."
              exit 1
          }
          
          Write-Host "✅ Connected successfully! IP: $tsIP"
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
